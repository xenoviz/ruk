name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified package
    if: github.repository == 'xenoviz/ruk'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.9.0
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release.mjs
      - name: Validate and test
        run: |
          npm run check
          npm run test:coverage
          npm run pack:check
      - name: Publish with npm trusted publishing
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
