name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Publish verified npm package
    if: github.repository == 'xenoviz/ruk'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.9.0
      - name: Install without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/verify-release.ts
      - name: Validate and test
        run: |
          bun run check
          bun run test:coverage
          bun run pack:check
      - name: Publish with npm trusted publishing
        run: bun scripts/publish-package.ts

  binaries:
    name: Build ${{ matrix.output }}
    if: github.repository == 'xenoviz/ruk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            output: ruk-linux-x64
          - target: bun-linux-arm64
            output: ruk-linux-arm64
          - target: bun-linux-x64-musl-baseline
            output: ruk-linux-x64-musl
          - target: bun-darwin-x64
            output: ruk-macos-x64
          - target: bun-darwin-arm64
            output: ruk-macos-arm64
          - target: bun-windows-x64-baseline
            output: ruk-windows-x64.exe
          - target: bun-windows-arm64
            output: ruk-windows-arm64.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/verify-release.ts
      - name: Build executable
        env:
          RUK_BINARY_TARGET: ${{ matrix.target }}
          RUK_BINARY_OUTFILE: artifacts/${{ matrix.output }}
        run: bun run binary:build
      - name: Create checksum
        working-directory: artifacts
        run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"
      - name: Attest executable provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/${{ matrix.output }}
      - name: Stage release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.output }}
          path: |
            artifacts/${{ matrix.output }}
            artifacts/${{ matrix.output }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  finalize:
    name: Finalize ready release
    if: github.repository == 'xenoviz/ruk'
    needs: [package, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Download staged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Create and verify readiness manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/create-release-manifest.ts
      - name: Attest readiness manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/ruk-release.json
      - name: Publish assets and readiness manifest last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -Fxq ruk-release.json <<<"$EXISTING_ASSETS"; then
            gh release delete-asset "$RELEASE_TAG" ruk-release.json --yes
          fi
          mapfile -d '' ASSETS < <(find artifacts -maxdepth 1 -type f ! -name ruk-release.json -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          gh release upload "$RELEASE_TAG" artifacts/ruk-release.json --clobber

  windows-update-smoke:
    name: Windows release-to-release update
    if: github.repository == 'xenoviz/ruk'
    needs: finalize
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Exercise previous Windows executable updater
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/verify-release-update.ts
