name: Release

on:
  push:
    # This includes stable and prerelease tags such as v0.3.0-beta.1.
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify protected release source
    if: github.repository == 'xenoviz/ruk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require ancestry from protected main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not reachable from protected main." >&2
            exit 1
          }

  verify:
    name: Verify Go release
    if: github.repository == 'xenoviz/ruk'
    needs: verify-release-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.24.x
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Test Go packages with the race detector
        run: go test -race ./...
      - name: Setup Bun for release verification tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install release verification tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify release tag and package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/verify-release.ts
      - name: Compare TypeScript and Go CLIs
        run: bun run test:conformance

  platform-smoke:
    name: Release platform smoke (${{ matrix.os }})
    if: github.repository == 'xenoviz/ruk'
    needs: verify-release-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.24.x
          cache: true
      - name: Exercise native Go command
        run: |
          go run ./cmd/ruk --version
          go run ./cmd/ruk --help

  binaries:
    name: Build ${{ matrix.output }}
    if: github.repository == 'xenoviz/ruk'
    needs: [verify, platform-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: ruk-linux-x64
          - goos: linux
            goarch: arm64
            output: ruk-linux-arm64
          - goos: linux
            goarch: amd64
            output: ruk-linux-x64-musl
          - goos: darwin
            goarch: amd64
            output: ruk-macos-x64
          - goos: darwin
            goarch: arm64
            output: ruk-macos-arm64
          - goos: windows
            goarch: amd64
            output: ruk-windows-x64.exe
          - goos: windows
            goarch: arm64
            output: ruk-windows-arm64.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.24.x
          cache: true
      - name: Build Go executable
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          mkdir -p artifacts
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.distribution=standalone" -o "artifacts/${{ matrix.output }}" ./cmd/ruk
          test -s "artifacts/${{ matrix.output }}"
      - name: Create checksum
        working-directory: artifacts
        run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"
      - name: Attest executable provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/${{ matrix.output }}
      - name: Stage release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.output }}
          path: |
            artifacts/${{ matrix.output }}
            artifacts/${{ matrix.output }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  platform-packages:
    name: Publish ${{ matrix.package }}
    if: github.repository == 'xenoviz/ruk'
    needs: [verify, platform-smoke]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            package: '@xenoviz/ruk-linux-x64'
            template: npm/ruk-linux-x64
            binary: ruk
          - goos: linux
            goarch: arm64
            package: '@xenoviz/ruk-linux-arm64'
            template: npm/ruk-linux-arm64
            binary: ruk
          - goos: linux
            goarch: amd64
            package: '@xenoviz/ruk-linux-x64-musl'
            template: npm/ruk-linux-x64-musl
            binary: ruk
          - goos: darwin
            goarch: amd64
            package: '@xenoviz/ruk-darwin-x64'
            template: npm/ruk-darwin-x64
            binary: ruk
          - goos: darwin
            goarch: arm64
            package: '@xenoviz/ruk-darwin-arm64'
            template: npm/ruk-darwin-arm64
            binary: ruk
          - goos: windows
            goarch: amd64
            package: '@xenoviz/ruk-windows-x64'
            template: npm/ruk-windows-x64
            binary: ruk.exe
          - goos: windows
            goarch: arm64
            package: '@xenoviz/ruk-windows-arm64'
            template: npm/ruk-windows-arm64
            binary: ruk.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.9.0
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.24.x
          cache: true
      - name: Build package-mode executable
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PACKAGE_BINARY: ${{ matrix.binary }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          mkdir -p artifacts
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.distribution=package" -o "artifacts/${PACKAGE_BINARY}" ./cmd/ruk
          test -s "artifacts/${PACKAGE_BINARY}"
      - name: Stage and verify native npm package
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          PACKAGE_TEMPLATE: ${{ matrix.template }}
          PACKAGE_BINARY: ${{ matrix.binary }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          node scripts/npm/package.mjs --kind platform --version "$VERSION" --template "$PACKAGE_TEMPLATE" --binary "artifacts/$PACKAGE_BINARY" --output platform-package
          npm pack --dry-run --ignore-scripts ./platform-package
      - name: Publish native npm package with provenance
        env:
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}
        run: |
          npm publish --access public --provenance --tag "$NPM_TAG" --ignore-scripts ./platform-package

  package:
    name: Publish verified metadata npm package
    if: github.repository == 'xenoviz/ruk'
    needs: platform-packages
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.9.0
      - name: Verify release tag and stage metadata package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/npm/package.mjs --kind root --version "$VERSION" --template npm/ruk --scripts scripts/npm --license LICENSE --output root-package
          npm pack --dry-run --ignore-scripts ./root-package
      - name: Publish metadata package with npm provenance
        env:
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_TAG" --ignore-scripts ./root-package

  finalize:
    name: Finalize ready release
    if: github.repository == 'xenoviz/ruk'
    needs: [package, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Prepare mutable draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if RELEASE=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            if [[ $(jq -r '.isDraft' <<<"$RELEASE") == "false" ]]; then
              if jq -e '.assets | any(.name == "ruk-release.json")' <<<"$RELEASE" >/dev/null; then
                echo "ready=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Published release $RELEASE_TAG is missing its readiness manifest." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Ruk ${RELEASE_TAG#v}"
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
      - name: Checkout release commit
        if: steps.release.outputs.ready != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Bun for release manifest tooling
        if: steps.release.outputs.ready != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Download staged assets
        if: steps.release.outputs.ready != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Create and verify readiness manifest
        if: steps.release.outputs.ready != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/create-release-manifest.ts
      - name: Attest readiness manifest
        if: steps.release.outputs.ready != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/ruk-release.json
      - name: Upload assets and readiness manifest last
        if: steps.release.outputs.ready != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -Fxq ruk-release.json <<<"$EXISTING_ASSETS"; then
            gh release delete-asset "$RELEASE_TAG" ruk-release.json --yes
          fi
          mapfile -d '' ASSETS < <(find artifacts -maxdepth 1 -type f ! -name ruk-release.json -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          gh release upload "$RELEASE_TAG" artifacts/ruk-release.json --clobber
      - name: Publish immutable ready release
        if: steps.release.outputs.ready != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  windows-update-smoke:
    name: Windows release-to-release update
    if: github.repository == 'xenoviz/ruk'
    needs: finalize
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Bun for release smoke tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Exercise previous Windows executable updater
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/verify-release-update.ts
