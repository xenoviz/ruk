name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality (Node 24.14.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Validate repository
        run: bun run check
      - name: Test compiled Node.js distribution with coverage
        run: bun run test:coverage
      - name: Build and exercise native Linux executable
        run: bun run binary:check
      - name: Build and install package tarball
        run: bun run pack:check
      - name: Cross-compile release executables
        run: bun run binary:cross-check
      - name: Build documentation
        run: bun run docs:build

  compatibility:
    name: Compatibility (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.14.0
          - os: windows-latest
            node: 22.14.0
          - os: windows-latest
            node: 24.14.0
          - os: macos-latest
            node: 24.14.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test compiled Node.js distribution
        run: bun run test:node

  macos-node-22:
    name: Compatibility (macos-latest, Node 22.14.0)
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test compiled Node.js distribution
        run: bun run test:node

  native:
    name: Native executable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build and exercise native executable
        run: bun run binary:check

  required:
    name: Required checks
    if: always()
    needs: [quality, compatibility, macos-node-22, native]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          MACOS_NODE_22_RESULT: ${{ needs.macos-node-22.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$MACOS_NODE_22_RESULT" = success || test "$MACOS_NODE_22_RESULT" = skipped
