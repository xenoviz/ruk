name: Tag release

# Tag a merged version bump and start the release workflow, so a release no
# longer depends on someone pushing the tag by hand. A tag pushed with
# GITHUB_TOKEN does not trigger other workflows, but workflow_dispatch does.
on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and dispatch release
    if: github.repository == 'xenoviz/ruk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Bun for release tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Create the version tag when it is new
        id: tag
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fails unless CHANGELOG.md has the dated entry for this version.
          RELEASE_TAG="$TAG" bun scripts/release-notes.ts > /dev/null
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch the release workflow on the tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
