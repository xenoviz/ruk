name: Publish standalone executables

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: binaries-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.output }}
    if: github.repository == 'xenoviz/ruk'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            output: ruk-linux-x64
          - target: bun-linux-arm64
            output: ruk-linux-arm64
          - target: bun-linux-x64-musl-baseline
            output: ruk-linux-x64-musl
          - target: bun-darwin-x64
            output: ruk-macos-x64
          - target: bun-darwin-arm64
            output: ruk-macos-arm64
          - target: bun-windows-x64-baseline
            output: ruk-windows-x64.exe
          - target: bun-windows-arm64
            output: ruk-windows-arm64.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/verify-release.ts
      - name: Build executable
        env:
          RUK_BINARY_TARGET: ${{ matrix.target }}
          RUK_BINARY_OUTFILE: artifacts/${{ matrix.output }}
        run: bun run binary:build
      - name: Create checksum
        working-directory: artifacts
        run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"
      - name: Attest executable provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/${{ matrix.output }}
      - name: Attach executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OUTPUT: ${{ matrix.output }}
        run: gh release upload "$RELEASE_TAG" "artifacts/$OUTPUT" "artifacts/$OUTPUT.sha256" --clobber
