name: Runtime benchmark

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform(s) to benchmark
        required: true
        type: choice
        options:
          - both
          - linux
          - windows
        default: both
      targets:
        description: Runtime targets (comma-separated)
        required: true
        type: string
        default: node,go
      samples:
        description: Samples per target/concurrency cell
        required: true
        type: string
        default: '3'
      duration:
        description: Wrapper duration in milliseconds
        required: true
        type: string
        default: '26000'
      concurrency:
        description: Wrapper concurrency levels (comma-separated)
        required: true
        type: string
        default: 1,10,20

permissions:
  contents: read

jobs:
  benchmark:
    name: Runtime benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'both' && '["ubuntu-latest","windows-latest"]' || inputs.platform == 'linux' && '["ubuntu-latest"]' || '["windows-latest"]') }}
    env:
      LEGACY_COMMIT: 86e3ac6f5883719d14522e14a14dc0520e74040d
    steps:
      - name: Checkout Go migration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.24.6
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Install benchmark tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build previous Node oracle (POSIX)
        if: runner.os != 'Windows' && contains(inputs.targets, 'node')
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/ruk-node-oracle" "$LEGACY_COMMIT"
          cd "$RUNNER_TEMP/ruk-node-oracle"
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - name: Build previous Node oracle (Windows)
        if: runner.os == 'Windows' && contains(inputs.targets, 'node')
        shell: pwsh
        run: |
          git worktree add --detach "$env:RUNNER_TEMP\ruk-node-oracle" "$env:LEGACY_COMMIT"
          Set-Location "$env:RUNNER_TEMP\ruk-node-oracle"
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - name: Build Go runtime and Node benchmark harness
        shell: bash
        env:
          RUK_BINARY_OUTFILE: ${{ runner.os == 'Windows' && 'artifacts/ruk.exe' || 'artifacts/ruk' }}
          RUK_DISTRIBUTION: package
        run: |
          bun run binary:build
          bun build scripts/benchmark-runtime.ts --target=node --outfile=artifacts/benchmark-runtime.mjs
      - name: Measure runtimes (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUK_BENCH_NODE: node
          RUK_BENCH_TARGETS: ${{ inputs.targets }}
          RUK_BENCH_SAMPLES: ${{ inputs.samples }}
          RUK_BENCH_DURATION: ${{ inputs.duration }}
          RUK_BENCH_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          node artifacts/benchmark-runtime.mjs \
            --node "$RUNNER_TEMP/ruk-node-oracle/dist/bin/ruk.js" \
            --binary artifacts/ruk \
            --targets "$RUK_BENCH_TARGETS" \
            --samples "$RUK_BENCH_SAMPLES" \
            --duration "$RUK_BENCH_DURATION" \
            --ttl 0.5 \
            --concurrency "$RUK_BENCH_CONCURRENCY" \
            > artifacts/runtime-benchmark.json
      - name: Measure runtimes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUK_BENCH_NODE: node
          RUK_BENCH_TARGETS: ${{ inputs.targets }}
          RUK_BENCH_SAMPLES: ${{ inputs.samples }}
          RUK_BENCH_DURATION: ${{ inputs.duration }}
          RUK_BENCH_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          node artifacts/benchmark-runtime.mjs `
            --node "$env:RUNNER_TEMP\ruk-node-oracle\dist\bin\ruk.js" `
            --binary artifacts\ruk.exe `
            --targets "$env:RUK_BENCH_TARGETS" `
            --samples "$env:RUK_BENCH_SAMPLES" `
            --duration "$env:RUK_BENCH_DURATION" `
            --ttl 0.5 `
            --concurrency "$env:RUK_BENCH_CONCURRENCY" `
            | Set-Content -Encoding utf8 artifacts\runtime-benchmark.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-benchmark-${{ runner.os }}-${{ github.sha }}
          path: artifacts/runtime-benchmark.json
          if-no-files-found: warn
          retention-days: 30
